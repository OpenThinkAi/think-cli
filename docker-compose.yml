services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "4823"
      THINK_DB_PATH: "/data/open-think.sqlite"
      # think's own config/index/repo dirs live on the persistent volume, so
      # they work under the read-only root fs below and survive recreating
      # the container (AGT-2341).
      THINK_HOME: "/data/think"
    # Loopback only (AGT-2340). The proxy speaks plain HTTP and authenticates
    # with a static bearer token, and Docker-published ports bypass host
    # firewalls such as ufw — so publishing on 0.0.0.0 would put the token
    # on the wire to every network the host is on. To serve other machines,
    # put a TLS-terminating reverse proxy (Caddy, nginx) on this host in
    # front of 127.0.0.1:4823, or reach it over Tailscale/WireGuard.
    ports:
      - "127.0.0.1:4823:4823"
    volumes:
      - open-think-data:/data
    # Least privilege (AGT-2341): drop every Linux capability (the server
    # binds an unprivileged port and runs as uid 1000, so it needs none),
    # forbid privilege gain via setuid binaries, and make the root
    # filesystem read-only. Writable paths: /data (the volume above: the
    # SQLite DB and THINK_HOME), /tmp, and the node user's home as an
    # ephemeral tmpfs for anything else written under $HOME (lost when the
    # container restarts, as the old writable layer was on recreate).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /home/node:uid=1000,gid=1000,mode=0700
    # AGT-064 AC #5: restart policy + resource caps. `unless-stopped` keeps
    # the proxy alive across host reboots while still respecting an explicit
    # `docker compose down`. Caps are conservative single-tenant defaults
    # — `think serve` is a thin Hono app over node:sqlite, so 512M / 1.0
    # CPU is plenty under realistic load and bounds the blast radius of a
    # connector pathology (runaway poll, payload flood). Tune up if real
    # workload demands it.
    #
    # `deploy.resources.limits` is honored by Compose v2 (`docker compose`)
    # but silently ignored by legacy Compose v1 (`docker-compose`, dash). If
    # you're running v1, the limits don't apply — upgrade to v2.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  open-think-data:
